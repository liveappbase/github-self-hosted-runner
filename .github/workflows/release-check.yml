# release-check — the repository's own check, on a GitHub-hosted Mac. It runs tools/release-check with the GENERIC
# rules only: the maintainers' private list never leaves their machines (docs/operations.md, "Releasing"). Then the
# tests under tests/ (stdlib unittest): they run copies of the tools against stubs in a temporary folder, never a
# host path; the decision core and the watchdog under /usr/bin/jq (core/TESTED_JQ's local row). They run through
# tools/run-tests: the tests of the plain `unittest discover -s tests -t .` line, one process per test module, as many
# at a time as the Mac has CPUs (3 on macos-latest); a module that fails, crashes or does not report fails the step,
# and its block names it. The jq-linux jobs run
# the core's and the watchdog's tests once per ci row of core/TESTED_JQ, in that image with its own jq package;
# tools/release-check --build reads their results on the tagged commit by their names, "jq VERSION (IMAGE)". The
# hetzner jobs run tests/hetzner (linux-docker/'s scripts; pool-image.sh's unattended switch asks core/idle.jq, under
# the image's jq) in the images of the ubuntu rows, in parts by module name: those cells run as root in the job's
# container, and fail rather than skip on a Linux root without a container's /.dockerenv (tests/hetzner/support.py).
# Each jq-linux job waits for them and fails unless every hetzner job passed (needs.hetzner.result: the CI's own view).
# A tag does not rest on that roll-up of a matrix, which GitHub does not document: tools/release-check --build needs
# EVERY check run of the tagged commit `completed success` (each hetzner job by its own, every job of this file, any
# later job), the newest run of each name deciding. GitHub reports a pull_request run's check runs on the PR HEAD,
# under the same names as the push run's, but its GITHUB_SHA is the MERGE commit of the PR: so every job fetches
# "$SHA", which its fetch step's env sets to the PR head, else github.sha (never the expression inside run:). Each
# check run on a commit then tested that commit's tree; the PR's merge result is tested by the push run on main after
# the merge. The jobs hetzner and jq-linux keep a closed shape (tests/core/test_workflow.py): no continue-on-error, no
# step-level if, a hetzner matrix of image and part only; every job fetches "$SHA". No action is used, so there is no
# action to pin: the commit is fetched with plain git, with its full history (the home-data rules read every reachable
# commit). Never pull_request_target; the token can only read.
name: release-check
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: macos-latest
    # The tests step took 4.4-4.8 min through 1f81eb6; the Studio window tests (4d2a46e) took it past 11.7 min and the
    # job hit 15 min (run 41681004376, cancelled). Locally the suite went from 422 s to 812 s. The step took 878 s in run
    # 41723291108, so it runs tools/run-tests: on a 16-CPU Mac under load, 1030 tests took 1209 s with the plain line,
    # 343 s at -j 3 and 318 s at -j 16. Its floor is the slowest module (the Studio window tests, about 300 s).
    timeout-minutes: 30
    steps:
      - name: Fetch the commit and its history
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q src
          git -C src remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git -C src fetch -q --no-tags origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
      - name: A bash 5.2 or newer on PATH (release-check parses linux-docker/'s scripts with it; Homebrew's, if the image has none)
        run: |
          for b in $(which -a bash); do "$b" -c '(( BASH_VERSINFO[0] * 100 + BASH_VERSINFO[1] >= 502 ))' && exit 0; done
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
      - name: tools/release-check
        working-directory: src
        run: /bin/zsh -f tools/release-check
      - name: tests
        working-directory: src
        env:
          JQ: /usr/bin/jq
        run: python3 -I tools/run-tests -v
  hetzner:
    name: hetzner ${{ matrix.part }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    # In parts, each a -p pattern of unittest discover (tests/core/test_workflow.py: together they run every module of
    # tests/hetzner exactly once). In one job per image, tests/hetzner took 1028 and 1105 s in CI at 243 cells (run
    # 41815113783), its rows 20 and 21 min of 30. Each part is a job of its own: its cells share nothing with another
    # part's (a Pool cell needs /home/root to itself, so two modules in one container cannot run at once). At 251 cells
    # the parts took 201-223, 173-194, 222-236 and 167-169 s in local containers of both images (S2b-3b-1), and CI
    # took about 1.35 times a local run: the slowest part is about 6 min. A part that nears 15 min gets a pattern more.
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:24.04"]
        part: ["test_[a-q]*.py", "test_[!a-qu]*.py", "test_un*.py", "test_u[!n]*.py"]
    steps:
      - name: git, python3, the image's own jq package, and curl and openssl (tests/hetzner)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git jq openssl python3
      - name: Fetch the commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q src
          git -C src remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git -C src fetch -q --no-tags --depth 1 origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
      - name: the cells of tests/hetzner in this part
        working-directory: src
        env:
          JQ: /usr/bin/jq
        run: python3 -I -m unittest discover -s tests/hetzner -t . -p '${{ matrix.part }}' -v
  jq-linux:
    name: jq ${{ matrix.jq }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    # after the hetzner jobs (it reports them: see the last step), and also when one of them failed
    needs: hetzner
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {jq: jq-1.8.1, image: "ubuntu:26.04", areas: "core watchdog"}
          - {jq: jq-1.7, image: "ubuntu:24.04", areas: "core watchdog"}
          - {jq: jq-1.6, image: "debian:bookworm-slim", areas: "watchdog"}
    steps:
      - name: git, python3 and the image's own jq package
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates git jq python3
      - name: Fetch the commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q src
          git -C src remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git -C src fetch -q --no-tags --depth 1 origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
      - name: the image's jq is the row's
        run: test "$(/usr/bin/jq --version)" = "${{ matrix.jq }}"
      - name: the core's and the watchdog's tests
        working-directory: src
        env:
          JQ: /usr/bin/jq
        run: for a in ${{ matrix.areas }}; do python3 -I -m unittest discover -s tests/$a -t . -v || exit 1; done
      - name: every hetzner job of this commit passed
        run: test "${{ needs.hetzner.result }}" = success
